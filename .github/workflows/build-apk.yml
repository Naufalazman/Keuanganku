name: Build DompetKu Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "/usr/local/lib/android/sdk/cmdline-tools" ]; then
            CMDLINE_BIN=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
            if [ -n "$CMDLINE_BIN" ]; then
              yes | "$CMDLINE_BIN" --licenses || true
            fi
          fi

      - name: Prepare Project Structure (Auto-Unzip & Self-Heal)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            for z in *.zip; do
              unzip -o "$z"
            done
          fi

          mkdir -p app/src/main/java/id/dompetku/pro
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          if [ -f "dompetku_pro_android_pwa.html" ] && [ ! -f "app/src/main/assets/index.html" ]; then
            cp dompetku_pro_android_pwa.html app/src/main/assets/index.html
          elif [ -f "index.html" ] && [ ! -f "app/src/main/assets/index.html" ]; then
            cp index.html app/src/main/assets/index.html
          fi

          if [ ! -f "gradle.properties" ]; then
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi

          if [ ! -f "settings.gradle.kts" ]; then
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DompetKuPro"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "id.dompetku.pro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "id.dompetku.pro"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.0.0-Ultimate"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          fi

          if [ ! -f "app/src/main/res/values/styles.xml" ]; then
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#0F172A</item>
              </style>
          </resources>
          EOF
          fi

          if [ ! -f "app/src/main/res/drawable/ic_dompetku_launcher.xml" ]; then
          cat << 'EOF' > app/src/main/res/drawable/ic_dompetku_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#4F46E5" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M34,30h24c14,0 24,10 24,24s-10,24 -24,24H34V30zM46,42v24h12c7,0 12,-5 12,-12s-5,-12 -12,-12H46z"/>
          </vector>
          EOF
          fi

          if [ -f "AndroidManifest.xml" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_dompetku_launcher"
                  android:label="DompetKu Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if [ -f "MainActivity.kt" ] && [ ! -f "app/src/main/java/id/dompetku/pro/MainActivity.kt" ]; then
            cp MainActivity.kt app/src/main/java/id/dompetku/pro/MainActivity.kt
          fi

          if [ ! -f "app/src/main/java/id/dompetku/pro/MainActivity.kt" ]; then
          cat << 'EOF' > app/src/main/java/id/dompetku/pro/MainActivity.kt
          package id.dompetku.pro

          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.allowFileAccess = true
                  settings.databaseEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          EOF
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DompetKu-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
